version: '3'

vars:
  NUCBOX_USER: nikita
  NUCBOX_HOST: 192.168.1.136

tasks:
  sops:encrypt:
    desc: Encrypt raw secret files
    cmds:
      - PYTHONPATH=. uv run scripts/encrypt-secrets.py

  sops:decrypt:
    desc: Decrypt tracked secret files into local raw copies
    cmds:
      - PYTHONPATH=. uv run scripts/decrypt-secrets.py

  nucbox:installer:
    dir: nixos
    deps: [sops:encrypt]
    cmds:
      - |
        nix run github:nix-community/nixos-anywhere -- \
          --flake .#nucbox \
          --generate-hardware-config nixos-generate-config \
          ./hosts/nucbox/hardware-configuration.nix \
          --target-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
          --build-on remote

  nucbox:rebuild:
    dir: nixos
    deps: [sops:encrypt]
    cmds:
      - |
        nix run nixpkgs#nixos-rebuild -- \
            switch \
            --flake .#nucbox \
            --target-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --build-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --sudo

  nucbox:rebuild:test:
    dir: nixos
    deps: [sops:encrypt]
    cmds:
      - |
        nix run nixpkgs#nixos-rebuild -- \
            test \
            --flake .#nucbox \
            --target-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --build-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --sudo
