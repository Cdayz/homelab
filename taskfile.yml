version: '3'

vars:
  NUCBOX_USER: nikita
  NUCBOX_HOST: 192.168.1.136
  NUCBOX_NOMAD_JOBS_DIR: /home/{{ .NUCBOX_USER }}/nomad-jobs

tasks:
  auth:generate-user:
    cmds:
      - docker run --rm -it authelia/authelia:latest authelia crypto hash generate argon2

  auth:oidc:generate-jwks-key:
    cmds:
      - openssl genrsa 4096

  auth:oidc:generate-client-secret:
    cmds:
      - docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986

  sops:encrypt:
    desc: Encrypt raw secret files
    cmds:
      - PYTHONPATH=. uv run scripts/encrypt-secrets.py

  sops:decrypt:
    desc: Decrypt tracked secret files into local raw copies
    cmds:
      - PYTHONPATH=. uv run scripts/decrypt-secrets.py

  nucbox:rebuild:
    dir: nixos
    deps: [sops:encrypt]
    cmds:
      - |
        nix run nixpkgs#nixos-rebuild -- \
            switch \
            --flake .#nucbox \
            --target-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --build-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --sudo

  nucbox:rebuild:test:
    dir: nixos
    deps: [sops:encrypt]
    cmds:
      - |
        nix run nixpkgs#nixos-rebuild -- \
            test \
            --flake .#nucbox \
            --target-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --build-host {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} \
            --sudo

  nomad:render:
    desc: Render nomad job directory
    cmds:
      - PYTHONPATH=. uv run scripts/render-nomad-job.py --job-name {{ .CLI_ARGS }} --remote-jobs-dir {{ .NUCBOX_NOMAD_JOBS_DIR }}

  nucbox:nomad:plan:
    desc: Render and plan nomad job
    cmds:
      - task: nomad:render
        vars:
          CLI_ARGS: "{{ .CLI_ARGS }}"
      - ssh {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} "sudo rm -rf {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }} && mkdir -p {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}"
      - rsync -a nomad/render/{{ .CLI_ARGS }}/ {{.NUCBOX_USER}}@{{.NUCBOX_HOST}}:{{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}/
      - ssh {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} "nomad job plan {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}/job.hcl"

  nucbox:nomad:deploy:
    desc: Render and deploy nomad job
    cmds:
      - task: nomad:render
        vars:
          CLI_ARGS: "{{ .CLI_ARGS }}"
      - ssh {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} "sudo rm -rf {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }} && mkdir -p {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}"
      - rsync -a nomad/render/{{ .CLI_ARGS }}/ {{.NUCBOX_USER}}@{{.NUCBOX_HOST}}:{{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}/
      - ssh {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} "nomad job run {{.NUCBOX_NOMAD_JOBS_DIR}}/{{ .CLI_ARGS }}/job.hcl"

  nucbox:nomad:stop:
    desc: Stop nomad job
    cmds:
      - ssh {{.NUCBOX_USER}}@{{.NUCBOX_HOST}} "nomad job stop {{ .CLI_ARGS }}"
