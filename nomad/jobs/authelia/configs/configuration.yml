# yaml-language-server: $schema=https://www.authelia.com/schemas/latest/json-schema/configuration.json

theme: auto

log:
  level: info

server:
  address: tcp://0.0.0.0:19091
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: false

access_control:
  default_policy: deny
  rules:
    - domain: "auth.cdayz.ru"
      policy: bypass

    - domain: "nomad.cdayz.ru"
      subject:
        - "group:admin"
      policy: two_factor

    - domain: "grafana.cdayz.ru"
      subject:
        - "group:admin"
      policy: two_factor

session:
  inactivity: 1w
  expiration: 1w
  remember_me: 1w

  cookies:
    - domain: "cdayz.ru"
      authelia_url: "https://auth.cdayz.ru"
      default_redirection_url: "https://home.cdayz.ru"

  redis:
    host: "127.0.0.1"
    port: 16379
    password: {{ secret "/run/authelia-secrets/valkey_password" | quote }}
    database_index: 2
    timeout: "5s"

storage:
  encryption_key: {{ secret "/run/authelia-secrets/encryption_key" | quote }}
  postgres:
    address: 'tcp://127.0.0.1:15432'
    servers: []
    database: 'authelia'
    schema: 'public'
    username: 'authelia'
    password: {{ secret "/run/authelia-secrets/pg_password" | quote }}
    timeout: '5s'

notifier:
  filesystem:
    filename: /data/notification.txt

identity_validation:
  reset_password: {}

definitions:
  user_attributes:
    immich_role:
      expression: '"admin" in groups ? "admin" : "user"'

identity_providers:
  oidc:
    jwks:
      - key_id: default
        algorithm: RS256
        use: sig
        key: {{ secret "/run/authelia-secrets/oidc_jwks_key" | mindent 10 "|" | msquote }}

    claims_policies:
      grafana:
        id_token:
          - email
          - name
          - groups
          - preferred_username
      immich_policy:
        custom_claims:
          immich_role:
            attribute: immich_role

    scopes:
      immich:
        claims:
          - immich_role

    clients:
      - client_id: oidc-cli
        client_name: OIDC CLI
        client_secret: {{ secret "/run/authelia-secrets/testing_oidc_client_secret_digest" | quote }}
        public: false
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - http://localhost:9555/callback
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      - client_id: immich
        client_name: Immich
        client_secret: {{ secret "/run/authelia-secrets/immich_oidc_client_secret_digest" | quote }}
        public: false
        authorization_policy: one_factor
        require_pkce: false
        pkce_challenge_method: ""
        claims_policy: immich_policy
        redirect_uris:
          - https://immich.cdayz.ru/auth/login
          - https://immich.cdayz.ru/user-settings
          - app.immich:///oauth-callback
        scopes:
          - openid
          - profile
          - email
          - groups
          - immich
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post

      - client_id: grafana
        client_name: Grafana
        client_secret: {{ secret "/run/authelia-secrets/grafana_oidc_client_secret_digest" | quote }}
        public: false
        authorization_policy: two_factor
        require_pkce: true
        pkce_challenge_method: "S256"
        claims_policy: grafana
        redirect_uris:
          - https://grafana.cdayz.ru/login/generic_oauth
        scopes:
          - openid
          - profile
          - email
          - groups
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      - client_id: coder
        client_name: Coder
        client_secret: '{{ secret "/run/authelia-secrets/coder_oidc_client_secret_digest" }}'
        public: false
        authorization_policy: two_factor
        redirect_uris:
          - https://coder.cdayz.ru/api/v2/users/oidc/callback
        scopes:
          - openid
          - profile
          - email
        require_pkce: false
        pkce_challenge_method: ''
        response_types:
          - code
        grant_types:
          - authorization_code
        token_endpoint_auth_method: client_secret_basic
        userinfo_signed_response_alg: none
