global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:19090

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: nomad
    metrics_path: /v1/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - 127.0.0.1:4646

  - job_name: grafana
    static_configs:
      - targets:
          - 127.0.0.1:13000

  - job_name: loki
    static_configs:
      - targets:
          - 127.0.0.1:13100

  - job_name: crowdsec
    static_configs:
      - targets:
          - 127.0.0.1:6060

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets:
          - 127.0.0.1:18181
