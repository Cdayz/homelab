- name: Install nomad prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - unzip
    state: present
    update_cache: true

- name: Install Nomad via binary
  ansible.builtin.include_tasks: install_binary.yml

- name: Create nomad directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/nomad.d, owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_data_dir }}", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_data_dir }}/client", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_data_dir }}/alloc", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_data_dir }}/alloc_mounts", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_plugin_dir }}", owner: "root", group: "root", mode: "0755" }
    - { path: "{{ nomad_jobs_dir }}", owner: "root", group: "root", mode: "0755" }

- name: Render nomad config
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: /etc/nomad.d/nomad.hcl
    owner: root
    group: root
    mode: "0644"
  notify: restart nomad

- name: Render nomad systemd unit
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart nomad

- name: Enable nomad
  ansible.builtin.systemd:
    name: nomad
    enabled: true
    state: started
