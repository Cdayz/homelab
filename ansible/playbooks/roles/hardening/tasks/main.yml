- name: Deploy sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Configure fail2ban jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Ensure nftables config is present
  ansible.builtin.template:
    src: /dev/null
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    ansible_template_content: "{{ nftables_ruleset }}"
  register: nftables_template_hack
  changed_when: false

- name: Write nftables ruleset
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: "{{ nftables_ruleset }}"
    validate: /usr/sbin/nft -c -f %s
  notify: Restart nftables

- name: Ensure nftables is enabled and started
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Disable core dumps via sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      fs.suid_dumpable = 0
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
  notify: Apply sysctl

- name: Ensure services are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - ssh
