- name: Ensure Pangolin directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pangolin_base_dir }}"
    - "{{ pangolin_base_dir }}/config"
    - "{{ pangolin_base_dir }}/config/db"
    - "{{ pangolin_base_dir }}/config/letsencrypt"
    - "{{ pangolin_base_dir }}/config/logs"
    - "{{ pangolin_base_dir }}/config/traefik"

- name: Ensure acme.json exists
  file:
    path: "{{ pangolin_base_dir }}/config/letsencrypt/acme.json"
    state: touch
    mode: "0600"

- name: Render Pangolin config
  template:
    src: config.yml.j2
    dest: "{{ pangolin_base_dir }}/config/config.yml"
    mode: "0644"

- name: Render Traefik static config
  template:
    src: traefik_config.yml.j2
    dest: "{{ pangolin_base_dir }}/config/traefik/traefik_config.yml"
    mode: "0644"

- name: Render Traefik dynamic config
  template:
    src: dynamic_config.yml.j2
    dest: "{{ pangolin_base_dir }}/config/traefik/dynamic_config.yml"
    mode: "0644"

- name: Ensure Nomad jobs directory exists
  file:
    path: "{{ nomad_jobs_dir }}"
    state: directory
    mode: "0755"

- name: Render Pangolin Nomad job
  template:
    src: pangolin.nomad.hcl.j2
    dest: "{{ nomad_jobs_dir }}/pangolin.nomad.hcl"
    mode: "0644"

- name: Run Pangolin Nomad job
  command: nomad job run "{{ nomad_jobs_dir }}/pangolin.nomad.hcl"
  when: pangolin_enabled
