- name: Ensure apt config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/apt/apt.conf.d
    - /etc/apt/sources.list.d

- name: Install base apt/python dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true

- name: Render apt tuning config
  ansible.builtin.template:
    src: 90homelab-apt.conf.j2
    dest: /etc/apt/apt.conf.d/90homelab
    owner: root
    group: root
    mode: "0644"

- name: Configure Debian mirror
  ansible.builtin.deb822_repository:
    name: debian
    types: [deb]
    uris: ["{{ apt_debian_mirror }}"]
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
      - "{{ ansible_facts['distribution_release'] }}-updates"
    components: "{{ apt_components }}"
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Configure Debian Security mirror
  ansible.builtin.deb822_repository:
    name: debian
    types: [deb]
    uris: ["{{ apt_debian_security_mirror }}"]
    suites:
      - "{{ ansible_facts['distribution_release'] }}-security"
    components: "{{ apt_components }}"
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Remove legacy apt sources.list
  ansible.builtin.file:
    path: /etc/apt/sources.list
    state: absent

- name: Update apt cache after repository changes
  ansible.builtin.apt:
    update_cache: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure admin users exist in sudo group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: sudo
    append: true
    shell: /bin/bash
  loop: "{{ admin_users }}"

- name: Ensure .ssh directory exists for admin users
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ admin_users }}"

- name: Enable unattended upgrades periodic config
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
      {% for item in unattended_upgrade_origins %}
              "{{ item }}";
      {% endfor %}
      };

      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Ensure journald persistent storage exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Configure journald persistent logging
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=persistent'
  notify: Restart journald

- name: Ensure services are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - unattended-upgrades
