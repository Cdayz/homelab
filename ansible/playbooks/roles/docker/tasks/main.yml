- name: Remove conflicting Docker-related distro packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
  ignore_errors: true

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    state: present
    types: [deb]
    uris: ["{{ docker_repo_base_url }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["amd64"]
    signed_by: "{{ docker_repo_base_url }}/gpg"

- name: Update apt cache after Docker repository changes
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Render docker daemon config
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Add admin users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ admin_users }}"

- name: Enable and start docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
