nftables_ruleset: |
  table inet filter {
    chain input {
      type filter hook input priority 0;
      policy drop;

      iif "lo" accept
      ct state established,related accept
      ct state invalid drop

      ip protocol icmp accept
      ip6 nexthdr icmpv6 accept

      tcp dport {{ ssh_port }} ct state new accept
    }

    chain forward {
      type filter hook forward priority 0;
      policy drop;

      ct state established,related accept
    }

    chain output {
      type filter hook output priority 0;
      policy accept;
    }
  }

  table bridge filter {
    chain forward {
      type filter hook forward priority 0;
      policy accept;
    }
  }

fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5

network_bridge_name: br0
network_bridge_members: [enp3s0, eno1]

network_bridge_use_dhcp: true
network_bridge_ipv6_accept_ra: false
network_bridge_link_local_addressing: false
network_bridge_enable_resolved: true

storage_mountpoint: /srv
storage_data_device: /dev/nvme0n1p5
storage_filesystem: ext4

storage_create_filesystem: false
storage_mount_opts: "defaults,noatime"

docker_data_root: "{{ storage_mountpoint }}/docker"
docker_repo_base_url: "https://mirror.yandex.ru/mirrors/download.docker.com/linux/debian/"

