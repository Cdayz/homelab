timezone: Europe/Moscow

ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_kbd_interactive_authentication: "no"
ssh_x11_forwarding: "no"
ssh_allow_tcp_forwarding: "no"
ssh_allow_agent_forwarding: "no"
ssh_permit_tunnel: "no"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_login_grace_time: 30
ssh_max_auth_tries: 3
ssh_max_sessions: 10

admin_users:
  - nikita

base_packages:
  - sudo
  - vim
  - curl
  - wget
  - git
  - htop
  - tmux
  - rsync
  - ca-certificates
  - gnupg
  - jq
  - unzip
  - zip
  - bash-completion
  - acl
  - python3
  - python3-apt
  - fail2ban
  - unattended-upgrades
  - apt-listchanges
  - nftables
  - net-tools
  - ethtool

apt_force_ipv4: true
apt_retries: 5
apt_timeout: 20
apt_pipeline_depth: 0

apt_debian_mirror: "https://mirror.yandex.ru/debian"
apt_debian_security_mirror: "https://mirror.yandex.ru/debian-security"
apt_components:
  - main
  - contrib
  - non-free
  - non-free-firmware

unattended_upgrade_origins:
  - "origin=Debian,codename=${distro_codename},label=Debian"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
  - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"

nftables_ruleset: |
  table inet filter {
    chain input {
      type filter hook input priority 0;
      policy drop;

      iif "lo" accept
      ct state established,related accept
      ct state invalid drop

      ip protocol icmp accept
      ip6 nexthdr icmpv6 accept

      tcp dport { {{ ssh_port }}, 80 } ct state new accept
    }

    chain forward {
      type filter hook forward priority 0;
      policy drop;

      ct state established,related accept
    }

    chain output {
      type filter hook output priority 0;
      policy accept;
    }
  }

  table bridge filter {
    chain forward {
      type filter hook forward priority 0;
      policy drop;

      ether type arp accept
      ip6 nexthdr icmpv6 accept
      udp sport 67 udp dport 68 accept
      udp sport 68 udp dport 67 accept

      ct state established,related accept
      accept
    }
  }

fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5

network_bridge_name: br0
network_bridge_members: [enp3s0, eno1]

network_bridge_use_dhcp: true
network_bridge_ipv6_accept_ra: false
network_bridge_link_local_addressing: false
network_bridge_enable_resolved: true

storage_mountpoint: /srv
storage_data_device: /dev/nvme0n1p5
storage_filesystem: ext4

storage_create_filesystem: false
storage_mount_opts: "defaults,noatime"

docker_data_root: "{{ storage_mountpoint }}/docker"
docker_repo_base_url: "https://mirror.yandex.ru/mirrors/download.docker.com/linux/debian/"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

nomad_version: "1.11.3"
nomad_region: global
nomad_datacenter: dc1
nomad_bind_addr: "127.0.0.1"
nomad_advertise_addr: "127.0.0.1"
nomad_data_dir: "{{ storage_mountpoint }}/nomad"
nomad_plugin_dir: /opt/nomad/plugins
nomad_binary_base_url: "https://mirror.yandex.ru/mirrors/releases.hashicorp.com"
nomad_jobs_dir: /etc/nomad.d/jobs

nomad_enable_server: true
nomad_enable_client: true
nomad_bootstrap_expect: 1

nomad_host_volumes:
  shared:
    path: "{{ storage_mountpoint }}/volumes/shared"
    read_only: false
  media:
    path: "{{ storage_mountpoint }}/volumes/media"
    read_only: false
  backups:
    path: "{{ storage_mountpoint }}/volumes/backups"
    read_only: false

pangolin_enabled: true
pangolin_bootstrap_mode: true

pangolin_base_dir: "{{ storage_mountpoint }}/pangolin"
pangolin_server_secret: "CHANGE_ME_TO_LONG_RANDOM_SECRET"

pangolin_image: "docker.io/fosrl/pangolin:1.17.0"
pangolin_gerbil_image: "docker.io/fosrl/gerbil:1.3.1"
pangolin_traefik_image: "docker.io/traefik:v3.6"
pangolin_traefik_badger_version: "v1.3.1"

pangolin_http_port: 80
pangolin_https_port: 443
